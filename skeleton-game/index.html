<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>骨骼蜈蚣 · 跟随小游戏</title>
<style>
  :root{
    color-scheme: dark;
    --panel: rgba(10, 14, 20, .72);
    --line: rgba(255,255,255,.12);
    --text: #f7f7f7;
    --muted: rgba(255,255,255,.66);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{
    position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    pointer-events:none;user-select:none
  }
  .card{
    padding:10px 12px;border:1px solid var(--line);border-radius:14px;
    background:var(--panel);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.28)
  }
  .title{font-size:14px;font-weight:700;letter-spacing:.06em}
  .stats{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.7}
  .actions{display:flex;gap:8px;pointer-events:auto}
  button{
    appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:12px;padding:9px 12px;font:inherit;font-size:12px;cursor:pointer;
    backdrop-filter:blur(10px)
  }
  button:hover{background:rgba(255,255,255,.1)}
  .tip{
    position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);white-space:nowrap;color:rgba(255,255,255,.72);
    font-size:12px;background:var(--panel);border:1px solid var(--line);
    padding:9px 12px;border-radius:999px;backdrop-filter:blur(10px);
    transition:opacity .4s
  }
  @media (max-width:560px){
    .title{font-size:13px}.stats{font-size:11px}.tip{font-size:11px}
    button{padding:8px 10px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="card">
    <div class="title">骨骼蜈蚣</div>
    <div class="stats">
      得分 <span id="score">0</span>　长度 <span id="length">24</span><br>
      移动鼠标 / 拖动屏幕控制
    </div>
  </div>
  <div class="actions">
    <button id="foodBtn">投喂</button>
    <button id="resetBtn">重置</button>
  </div>
</div>
<div class="tip" id="tip">点击空白处投喂，吃到发光球会变长 ✨</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const scoreEl = document.getElementById('score');
  const lengthEl = document.getElementById('length');
  const tipEl = document.getElementById('tip');

  let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
  let t = 0, last = performance.now(), score = 0;
  let pointer = { x: W * .62, y: H * .42, active: false };
  let foods = [], particles = [];
  const spine = [];
  const segmentGap = 14;
  const baseSegments = 24;
  let targetSegments = baseSegments;

  function resize(){
    W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if (!spine.length) resetCreature();
  }
  addEventListener('resize', resize, {passive:true});

  class Node {
    constructor(x,y){
      this.x=x; this.y=y; this.px=x; this.py=y;
    }
  }

  function resetCreature(){
    spine.length = 0;
    targetSegments = baseSegments;
    const sx = W * .45, sy = H * .52;
    for(let i=0;i<baseSegments;i++) spine.push(new Node(sx - i*segmentGap, sy));
    score=0; foods.length=0; particles.length=0;
    spawnFood(W*.72, H*.55);
    updateHUD();
  }

  function spawnFood(x,y){
    const margin=38;
    foods.push({
      x: Math.max(margin, Math.min(W-margin, x ?? (margin+Math.random()*(W-margin*2)))),
      y: Math.max(80, Math.min(H-margin, y ?? (90+Math.random()*(H-130)))),
      r: 5 + Math.random()*3,
      phase: Math.random()*Math.PI*2
    });
  }

  function burst(x,y){
    for(let i=0;i<24;i++){
      const a=Math.random()*Math.PI*2, s=40+Math.random()*130;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:1+Math.random()*2.5});
    }
  }

  function updateHUD(){
    scoreEl.textContent = score;
    lengthEl.textContent = spine.length;
  }

  canvas.addEventListener('pointermove', e => {
    pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true;
  });
  canvas.addEventListener('pointerdown', e => {
    pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true;
    spawnFood(e.clientX,e.clientY);
    tipEl.style.opacity='0';
  });
  canvas.addEventListener('touchmove', e => {
    if(e.touches[0]){
      pointer.x=e.touches[0].clientX;
      pointer.y=e.touches[0].clientY;
      pointer.active=true;
    }
    e.preventDefault();
  }, {passive:false});

  document.getElementById('foodBtn').addEventListener('click', () => spawnFood());
  document.getElementById('resetBtn').addEventListener('click', resetCreature);

  function addSegment(){
    const tail=spine[spine.length-1];
    const prev=spine[spine.length-2] || tail;
    const dx=tail.x-prev.x, dy=tail.y-prev.y;
    const d=Math.hypot(dx,dy)||1;
    spine.push(new Node(tail.x+dx/d*segmentGap,tail.y+dy/d*segmentGap));
  }

  function update(dt){
    t += dt;

    while(spine.length < targetSegments) addSegment();

    const head=spine[0];
    const dx=pointer.x-head.x, dy=pointer.y-head.y;
    const dist=Math.hypot(dx,dy)||1;
    const speed=Math.min(430, 115 + dist*2.25);
    const step=Math.min(dist, speed*dt);
    head.x += dx/dist*step;
    head.y += dy/dist*step;

    for(let pass=0;pass<3;pass++){
      for(let i=1;i<spine.length;i++){
        const a=spine[i-1], b=spine[i];
        const vx=b.x-a.x, vy=b.y-a.y;
        const d=Math.hypot(vx,vy)||.0001;
        const wanted=segmentGap*(1+Math.sin(t*3.2+i*.45)*.018);
        b.x=a.x+vx/d*wanted;
        b.y=a.y+vy/d*wanted;
      }
    }

    for(let i=foods.length-1;i>=0;i--){
      const f=foods[i];
      if(Math.hypot(head.x-f.x,head.y-f.y)<18+f.r){
        foods.splice(i,1);
        score++;
        targetSegments += 2;
        burst(f.x,f.y);
        updateHUD();
        setTimeout(()=>spawnFood(), 260);
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= Math.pow(.05,dt); p.vy *= Math.pow(.05,dt);
      p.life -= dt*1.35;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function normalAt(i){
    const a=spine[Math.max(0,i-1)], b=spine[Math.min(spine.length-1,i+1)];
    let dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.hypot(dx,dy)||1;
    return {x:-dy/d,y:dx/d,tx:dx/d,ty:dy/d};
  }

  function drawBoneLine(x1,y1,x2,y2,w=1,alpha=.85){
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.lineWidth=w; ctx.strokeStyle=`rgba(238,242,245,${alpha})`;
    ctx.stroke();
  }

  function drawLimb(i, side, phaseOffset){
    const p=spine[i], n=normalAt(i);
    const sway=Math.sin(t*5 + i*.55 + phaseOffset)*5;
    const hipX=p.x+n.x*side*7, hipY=p.y+n.y*side*7;
    const kneeX=hipX+n.x*side*(22+sway)+n.tx*8;
    const kneeY=hipY+n.y*side*(22+sway)+n.ty*8;
    const footX=kneeX+n.x*side*16-n.tx*(13+sway*.45);
    const footY=kneeY+n.y*side*16-n.ty*(13+sway*.45);
    drawBoneLine(hipX,hipY,kneeX,kneeY,1.25,.75);
    drawBoneLine(kneeX,kneeY,footX,footY,1.15,.72);
    drawBoneLine(footX,footY,footX+n.tx*7+n.x*side*3,footY+n.ty*7+n.y*side*3,.8,.62);
    drawBoneLine(footX,footY,footX+n.tx*5-n.x*side*4,footY+n.ty*5-n.y*side*4,.8,.58);
  }

  function drawCreature(){
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.save();
    ctx.shadowBlur=9;
    ctx.shadowColor='rgba(205,228,255,.20)';

    ctx.beginPath();
    ctx.moveTo(spine[0].x,spine[0].y);
    for(let i=1;i<spine.length;i++) ctx.lineTo(spine[i].x,spine[i].y);
    ctx.strokeStyle='rgba(245,248,250,.88)';
    ctx.lineWidth=1.65;
    ctx.stroke();

    for(let i=1;i<spine.length-2;i++){
      const p=spine[i], n=normalAt(i);
      const bodyScale=Math.sin(Math.PI*i/(spine.length-1));
      const rib=3+bodyScale*(17+Math.sin(i*.55+t*1.7)*1.8);
      const sweep=4+bodyScale*6;

      ctx.beginPath();
      ctx.arc(p.x,p.y, i<3?1.9:1.35,0,Math.PI*2);
      ctx.fillStyle='rgba(250,250,250,.84)';
      ctx.fill();

      if(i%2===0 && i<spine.length-5){
        for(const side of [-1,1]){
          const x1=p.x+n.x*side*2, y1=p.y+n.y*side*2;
          const x2=p.x+n.x*side*rib-n.tx*sweep, y2=p.y+n.y*side*rib-n.ty*sweep;
          const x3=p.x+n.x*side*(rib+7)-n.tx*(sweep+7), y3=p.y+n.y*side*(rib+7)-n.ty*(sweep+7);
          ctx.beginPath();
          ctx.moveTo(x1,y1);
          ctx.quadraticCurveTo(x2,y2,x3,y3);
          ctx.strokeStyle='rgba(231,237,240,.66)';
          ctx.lineWidth=.9;
          ctx.stroke();
        }
      }
    }

    const limbIndices=[];
    const start=5, end=Math.max(start+1,spine.length-7);
    const count=Math.min(5,Math.floor((end-start)/3));
    for(let k=0;k<count;k++){
      const i=Math.floor(start+(end-start)*(k/(Math.max(1,count-1))));
      limbIndices.push(i);
    }
    limbIndices.forEach((i,k)=>{
      drawLimb(i, k%2===0?1:-1, k*Math.PI*.7);
      if(k===1 || k===3) drawLimb(i, k%2===0?-1:1, k*Math.PI*.7+1.5);
    });

    const h=spine[0], n=normalAt(0);
    const neck=spine[1];
    let tx=h.x-neck.x, ty=h.y-neck.y;
    const td=Math.hypot(tx,ty)||1; tx/=td; ty/=td;
    ctx.beginPath();
    ctx.ellipse(h.x+tx*4,h.y+ty*4,9.5,6.3,Math.atan2(ty,tx),0,Math.PI*2);
    ctx.strokeStyle='rgba(248,248,248,.88)';
    ctx.lineWidth=1.2;
    ctx.stroke();
    for(const side of [-1,1]){
      ctx.beginPath();
      ctx.arc(h.x+tx*5+n.x*side*2.4,h.y+ty*5+n.y*side*2.4,1.1,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.fill();
    }
    for(const side of [-1,1]){
      const bx=h.x+tx*8+n.x*side*3, by=h.y+ty*8+n.y*side*3;
      const wave=Math.sin(t*4+side)*4;
      ctx.beginPath();
      ctx.moveTo(bx,by);
      ctx.quadraticCurveTo(
        bx+tx*12+n.x*side*(10+wave),
        by+ty*12+n.y*side*(10+wave),
        bx+tx*23+n.x*side*(13+wave)
      );
      ctx.strokeStyle='rgba(238,243,246,.72)';
      ctx.lineWidth=.85;
      ctx.stroke();
    }

    const tail=spine[spine.length-1], tn=normalAt(spine.length-1);
    const before=spine[spine.length-2];
    let ttx=tail.x-before.x, tty=tail.y-before.y;
    const ttd=Math.hypot(ttx,tty)||1; ttx/=ttd; tty/=ttd;
    for(const side of [-1,1]){
      const wave=Math.sin(t*3+side*2)*5;
      drawBoneLine(tail.x,tail.y,tail.x+ttx*15+tn.x*side*(7+wave),tail.y+tty*15+tn.y*side*(7+wave),.9,.62);
    }
    ctx.restore();
  }

  function drawFood(){
    for(const f of foods){
      const pulse=1+Math.sin(t*5+f.phase)*.22;
      const r=f.r*pulse;
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r*5);
      g.addColorStop(0,'rgba(255,255,255,1)');
      g.addColorStop(.18,'rgba(208,242,255,.9)');
      g.addColorStop(.45,'rgba(120,210,255,.24)');
      g.addColorStop(1,'rgba(120,210,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(f.x,f.y,r*5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.95)';
      ctx.beginPath(); ctx.arc(f.x,f.y,Math.max(2,r*.55),0,Math.PI*2); ctx.fill();
    }
  }

  function drawParticles(){
    for(const p of particles){
      ctx.fillStyle=`rgba(220,244,255,${Math.max(0,p.life)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
  }

  function drawBackground(){
    ctx.fillStyle='#020304';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.globalAlpha=.035;
    ctx.strokeStyle='#b8d5e6';
    ctx.lineWidth=.5;
    const gap=44, ox=(t*6)%gap, oy=(t*3)%gap;
    for(let x=-gap+ox;x<W+gap;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=-gap+oy;y<H+gap;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.restore();

    ctx.beginPath();
    ctx.arc(pointer.x,pointer.y,8+Math.sin(t*5)*2,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,.12)';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  function frame(now){
    const dt=Math.min(.033,(now-last)/1000 || .016);
    last=now;
    update(dt);
    drawBackground();
    drawFood();
    drawCreature();
    drawParticles();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
